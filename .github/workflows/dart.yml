# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Publishing prerequisites (one-time, outside the repo). A missing secret fails
# the publish job loudly *after* the build, so confirm these before pushing a
# release tag — npm versions cannot be overwritten without penalty:
#   - repository secret NPM_TOKEN, with publish rights on the npm account
#   - the npm names easy-onvif-node / easy-onvif-web / easy-onvif-mcp claimed
#   - the version in each artifact package.json equals the tag it publishes

name: Dart

on:
  push:
    branches: [main]
    # npm releases are tagged per artifact, e.g. `easy_onvif_js-v3.1.5` or
    # `easy_onvif_mcp-v0.1.1`. Bare `v*` tags belong to pub.dev publishing
    # (see publish-pub-dev.yaml) and are deliberately NOT matched here, so a
    # single tag can never trigger two publishing paths.
    tags:
      - 'easy_onvif_js-v*'
      - 'easy_onvif_mcp-v*'
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v1

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set timezone
        run: sudo timedatectl set-timezone America/Toronto

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      # - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      # Melos scripts call other Melos scripts by bare name (`melos run x &&
      # melos run y`, `melos exec ...`), so the global binary has to exist and
      # be on PATH. Without this every nested script dies with
      # `/bin/sh: 1: eval: melos: not found`.
      - name: Install Melos on PATH
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: melos bootstrap

      # Layout guards. The npm artifacts are owned by their Dart packages and
      # the Flutter simulator lives under packages/, so a root `npm/` or
      # `server/` directory reappearing means a script or habit regressed.
      # Stale-path patterns are concatenated so this step does not match itself.
      - name: Verify repository layout
        run: |
          test ! -d npm || { echo "::error::root npm/ must not exist; npm manifests belong to their packages"; exit 1; }
          test ! -d server || { echo "::error::root server/ must not exist; the simulator is packages/easy_onvif_server"; exit 1; }
          STALE='npm/easy''-onvif'
          if grep -rn --include='*.yml' --include='*.yaml' --include='*.sh' --include='*.mjs' \
               -e "$STALE" -e 'cd serve''r ' .github tool packages/*/tool ; then
            echo "::error::obsolete root staging paths found in build surfaces"
            exit 1
          fi

      - name: Verify formatting
        run: melos run format-check

      - name: Analyze project source
        # Warnings are not fatal here on purpose: packages/easy_onvif/example
        # declares assets/config.yaml as a Flutter asset, and that file is
        # gitignored because it holds real camera credentials
        # (packages/easy_onvif/.gitignore -> **/config.yaml). It therefore
        # cannot exist on a clean checkout, and `dart analyze` treats the
        # resulting asset_does_not_exist warning as an error. Real analyzer
        # errors still fail this step.
        run: melos exec dart analyze --no-fatal-warnings .

      # Only the packages with hermetic tests. `easy_onvif`'s fixture-based
      # tests read XML from a test_data checkout that is not part of this
      # repository, so they are not runnable here.
      - name: Run MCP server tests
        working-directory: packages/easy_onvif_mcp
        run: dart test

  # Compiles every npm artifact once. Publishing jobs reuse this output so a
  # release tag never pays for `dart compile js` / `dart compile wasm` twice.
  build-npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Melos on PATH
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: melos bootstrap

      - name: Build npm packages
        run: melos run build:npm

      - name: Test the easy-onvif library runtimes
        run: melos run test:npm:library

      - name: Test the MCP bundle over a real handshake
        run: melos run test:npm:mcp

      - name: Inspect packed file lists
        run: |
          melos run pack:npm:library
          melos run pack:npm:mcp

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: |
            packages/easy_onvif_js/package.json
            packages/easy_onvif_js/src
            packages/easy_onvif_js/dist
            packages/easy_onvif_js/test
            packages/easy_onvif_js/README.md
            packages/easy_onvif_js/LICENSE
            packages/easy_onvif_mcp/package.json
            packages/easy_onvif_mcp/bin/easy-onvif-mcp.js
            packages/easy_onvif_mcp/dist
            packages/easy_onvif_mcp/test/npm
            packages/easy_onvif_mcp/tool/check_bin.mjs
            packages/easy_onvif_mcp/README.md
            packages/easy_onvif_mcp/LICENSE
          if-no-files-found: error

  # Publishes the built artifacts to a throwaway registry, installs them back
  # and runs them. This is the only way to catch packaging defects (missing
  # files, broken bin wiring, stale staged output) before an irreversible
  # publish, since the real registry needs a credential CI cannot use to create
  # a new package anyway.
  publish-rehearsal:
    name: Rehearse npm publish
    needs: build-npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download the artifacts the release jobs would ship
        uses: actions/download-artifact@v4
        with:
          name: npm-packages
          # upload-artifact stores entries relative to the common ancestor of
          # the listed paths, which is `packages/` here - so restoring into
          # `packages` recreates packages/easy_onvif_js and
          # packages/easy_onvif_mcp exactly as the publish jobs expect.
          path: packages

      - name: Publish, install and run against an ephemeral registry
        run: bash tool/rehearse_npm_publish.sh "$GITHUB_WORKSPACE"

  publish-easy-onvif:
    name: Publish easy-onvif
    needs: [build, build-npm, publish-rehearsal]
    if: startsWith(github.ref, 'refs/tags/easy_onvif_js-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          # upload-artifact stores entries relative to the common ancestor of
          # the listed paths, which is `packages/` here - so restoring into
          # `packages` recreates packages/easy_onvif_js and
          # packages/easy_onvif_mcp exactly as the publish jobs expect.
          path: packages

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches the package version
        working-directory: packages/easy_onvif_js
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#easy_onvif_js-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/easy_onvif_js
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-easy-onvif-mcp:
    name: Publish easy-onvif-mcp
    needs: [build, build-npm, publish-rehearsal]
    if: startsWith(github.ref, 'refs/tags/easy_onvif_mcp-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          # upload-artifact stores entries relative to the common ancestor of
          # the listed paths, which is `packages/` here - so restoring into
          # `packages` recreates packages/easy_onvif_js and
          # packages/easy_onvif_mcp exactly as the publish jobs expect.
          path: packages

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches the package version
        working-directory: packages/easy_onvif_mcp
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#easy_onvif_mcp-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/easy_onvif_mcp
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
