# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Publishing prerequisites (one-time, outside the repo). A missing secret fails
# the publish job loudly *after* the build, so confirm these before pushing a
# release tag — npm versions cannot be overwritten without penalty:
#   - repository secret NPM_TOKEN, with publish rights on the npm account
#   - the npm names easy-onvif-node / easy-onvif-web / easy-onvif-mcp claimed
#   - the version in each npm/*/package.json equals the tag it publishes

name: Dart

on:
  push:
    branches: [main]
    # npm releases are tagged per artifact, e.g. `easy_onvif_js-v3.1.5` or
    # `easy_onvif_mcp_js-v0.1.0`. Bare `v*` tags belong to pub.dev publishing
    # (see publish-pub-dev.yaml) and are deliberately NOT matched here, so a
    # single tag can never trigger two publishing paths.
    tags:
      - 'easy_onvif_js-v*'
      - 'easy_onvif_mcp_js-v*'
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v1

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set timezone
        run: sudo timedatectl set-timezone America/Toronto

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      # - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      # Melos scripts call other Melos scripts by bare name (`melos run x &&
      # melos run y`, `melos exec ...`), so the global binary has to exist and
      # be on PATH. Without this every nested script dies with
      # `/bin/sh: 1: eval: melos: not found`.
      - name: Install Melos on PATH
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: melos bootstrap

      - name: Verify formatting
        run: melos run format-check

      - name: Analyze project source
        run: melos run analyze

      # Only the packages with hermetic tests. `easy_onvif`'s fixture-based
      # tests read XML from a test_data checkout that is not part of this
      # repository, so they are not runnable here.
      - name: Run MCP server tests
        working-directory: packages/easy_onvif_mcp
        run: dart test

  # Compiles every npm artifact once. Publishing jobs reuse this output so a
  # release tag never pays for `dart compile js` / `dart compile wasm` twice.
  build-npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Melos on PATH
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: melos bootstrap

      - name: Build npm artifacts
        run: |
          melos run build:npm
          melos run build:npm:mcp

      - name: Smoke-test the node library bundle
        run: melos run smoke:npm:node

      - name: Smoke-test the MCP bundle over a real handshake
        run: melos run smoke:npm:mcp

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm/
          if-no-files-found: error

  publish-easy-onvif-node:
    name: Publish easy-onvif-node
    needs: [build, build-npm]
    if: startsWith(github.ref, 'refs/tags/easy_onvif_js-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches the package version
        working-directory: npm/easy-onvif-node
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#easy_onvif_js-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: npm/easy-onvif-node
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-easy-onvif-web:
    name: Publish easy-onvif-web
    needs: [build, build-npm]
    if: startsWith(github.ref, 'refs/tags/easy_onvif_js-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches the package version
        working-directory: npm/easy-onvif-web
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#easy_onvif_js-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: npm/easy-onvif-web
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-easy-onvif-mcp:
    name: Publish easy-onvif-mcp
    needs: [build, build-npm]
    if: startsWith(github.ref, 'refs/tags/easy_onvif_mcp_js-v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches the package version
        working-directory: npm/easy-onvif-mcp
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#easy_onvif_mcp_js-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: npm/easy-onvif-mcp
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
