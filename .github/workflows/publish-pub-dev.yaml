name: Publish to pub.dev

# Publishes whichever package(s) declare the version of the pushed tag, using
# pub.dev trusted publishing (OIDC) - no long-lived credential in the repo.
#
# Note: `dart-lang/setup-dart/.github/workflows/publish.yml@v1` is NOT OIDC - it
# injects a `PUB_TOKEN` secret and fails immediately when that is absent (seen
# in run 40212827989). Publishing directly is what actually uses the OIDC token.
#
# Prerequisites, per package, at https://pub.dev/packages/<name>/admin:
#   - add a "Trusted publisher": provider GitHub,
#     owner cdavis-code, repository easy_onvif_workspace,
#     workflow publish-pub-dev.yaml, environment (leave empty unless the job
#     uses one)
#
# Until that exists for a package, publishing it from CI has no credential to
# use, and the Dart CLI waits on an interactive browser sign-in - the job then
# ends at timeout-minutes below rather than failing fast (observed on
# easy_onvif_mcp before its trusted publisher was configured). Configure the
# trusted publisher first, or switch this step to a PUB_TOKEN secret from
# pub.dev/account/publishing.
#
# `easy_onvif` and `easy_onvif_cli` are version-locked, so one tag can legitimately
# match more than one package; every match is published, not just the first.
#
# npm artifacts publish from a different tag scheme (see dart.yml) so a single
# tag can never trigger both paths.

on:
  push:
    tags:
      # pub.dev's automated-publishing config holds a tag pattern containing
      # {{version}}. Both spellings are accepted here so either configured
      # pattern ('v{{version}}' or '{{version}}') can trigger the release.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - easy_onvif
          - easy_onvif_cli
          - easy_onvif_mcp

jobs:
  detect:
    name: Match tag to package version
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.match.outputs.packages }}
    steps:
      - uses: actions/checkout@v6

      - name: Collect every package whose version equals the tag
        id: match
        env:
          # Passed through the environment rather than interpolated into the
          # shell, so event payload text can never become script.
          SELECTED: ${{ github.event.inputs.package }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MATCHES='[]'

          for PKG in easy_onvif easy_onvif_cli easy_onvif_mcp; do
            if [ -n "$SELECTED" ] && [ "$PKG" != "$SELECTED" ]; then
              continue
            fi

            PKG_VERSION="$(grep '^version: ' "packages/$PKG/pubspec.yaml" | awk '{print $2}')"
            echo "  $PKG: $PKG_VERSION"

            # A manual dispatch publishes the chosen package as-is; a tag push
            # must name a version some package actually declares.
            if [ -n "$SELECTED" ] || [ "$TAG_VERSION" = "$PKG_VERSION" ]; then
              MATCHES="$(jq -c --arg name "$PKG" --arg dir "packages/$PKG" \
                '. + [{name: $name, dir: $dir}]' <<< "$MATCHES")"
            fi
          done

          if [ "$MATCHES" = '[]' ]; then
            echo "::error::No package declares version $TAG_VERSION"
            echo "Checked: easy_onvif, easy_onvif_cli, easy_onvif_mcp"
            exit 1
          fi

          echo "packages=$MATCHES" >> "$GITHUB_OUTPUT"
          echo "Publishing: $(jq -c 'map(.name)' <<< "$MATCHES")"

  publish:
    name: Publish ${{ matrix.package.name }}
    needs: detect
    # Without a trusted publisher on pub.dev, `dart pub publish` falls back to
    # interactive browser auth and waits on stdin forever (seen hanging in run
    # 40213634157). Fail the job instead of parking a runner for six hours.
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token for pub.dev trusted publishing
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Flutter, not setup-dart: root `dart pub get` also resolves
      # packages/easy_onvif/example, a Flutter app, and fails with
      # "depends on flutter from sdk which doesn't exist" on a Dart-only runner
      # (seen in run 40213338946).
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # The workspace has to resolve before a member can be packaged.
      - name: Resolve dependencies
        run: dart pub get

      - name: Verify the package
        working-directory: ${{ matrix.package.dir }}
        run: dart pub publish --dry-run

      # The Dart CLI only attempts OIDC when the runner exposes the token
      # endpoint, which GitHub injects for jobs holding `id-token: write`. If
      # these are empty, no pub.dev setting can help - the permission wiring is
      # the problem. If they are present but publishing still falls back to
      # interactive auth, the package's automated-publishing config is the
      # problem (repository name, or a tag pattern that does not match).
      - name: Check the OIDC endpoint is exposed
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC endpoint present (id-token: write is in effect)"
          else
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is empty - id-token: write is not reaching this job"
            exit 1
          fi

      - name: Publish
        working-directory: ${{ matrix.package.dir }}
        # Bounded and non-interactive on purpose. With no trusted publisher on
        # pub.dev the CLI starts a Google OAuth loopback flow and waits on a
        # browser callback CI can never serve, so an unbounded run just hangs
        # (run 40214623087 and 40216128200 both parked the full job timeout).
        # Failing here with the exact remedy beats a cancellation notice.
        run: |
          if ! timeout 240s dart pub publish --force < /dev/null; then
            echo "::error::Publish failed. If the log shows 'Waiting for your authorization', this package has no trusted publisher: open https://pub.dev/${PKG}/admin and add a GitHub trusted publisher for owner=cdavis-code, repository=easy_onvif_workspace, workflow=publish-pub-dev.yaml"
            exit 1
          fi
        env:
          PKG: ${{ matrix.package.name }}
