name: Publish to pub.dev

# Publishes whichever package(s) declare the version of the pushed tag, over
# pub.dev trusted publishing (OIDC) - no long-lived credential in the repo.
#
# Prerequisites, per package, at https://pub.dev/packages/<name>/admin:
#   - "Automated publishing" enabled with this repository
#     (cdavis-code/easy_onvif_workspace) and a tag pattern that contains
#     {{version}}; both 'v{{version}}' and '{{version}}' work with the trigger
#     below. Only a tag push matching it may publish - a workflow_dispatch run
#     can never authenticate, which makes dispatch useless as a check.
#   - No environment name, unless the job is given the same one.
#
# `easy_onvif` and `easy_onvif_cli` are version-locked, so one tag legitimately
# matches more than one package; every match is published.
#
# npm artifacts publish from a different tag scheme (see dart.yml).

on:
  push:
    tags:
      # pub.dev's automated-publishing config holds a tag pattern containing
      # {{version}}. Both spellings are accepted here so either configured
      # pattern ('v{{version}}' or '{{version}}') can trigger the release.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - easy_onvif
          - easy_onvif_cli
          - easy_onvif_mcp

jobs:
  detect:
    name: Match tag to package version
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.match.outputs.packages }}
    steps:
      - uses: actions/checkout@v6

      - name: Collect every package whose version equals the tag
        id: match
        env:
          # Passed through the environment rather than interpolated into the
          # shell, so event payload text can never become script.
          SELECTED: ${{ github.event.inputs.package }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MATCHES='[]'

          for PKG in easy_onvif easy_onvif_cli easy_onvif_mcp; do
            if [ -n "$SELECTED" ] && [ "$PKG" != "$SELECTED" ]; then
              continue
            fi

            PKG_VERSION="$(grep '^version: ' "packages/$PKG/pubspec.yaml" | awk '{print $2}')"
            echo "  $PKG: $PKG_VERSION"

            # A manual dispatch publishes the chosen package as-is; a tag push
            # must name a version some package actually declares.
            if [ -n "$SELECTED" ] || [ "$TAG_VERSION" = "$PKG_VERSION" ]; then
              MATCHES="$(jq -c --arg name "$PKG" --arg dir "packages/$PKG" \
                '. + [{name: $name, dir: $dir}]' <<< "$MATCHES")"
            fi
          done

          if [ "$MATCHES" = '[]' ]; then
            echo "::error::No package declares version $TAG_VERSION"
            echo "Checked: easy_onvif, easy_onvif_cli, easy_onvif_mcp"
            exit 1
          fi

          echo "packages=$MATCHES" >> "$GITHUB_OUTPUT"
          echo "Publishing: $(jq -c 'map(.name)' <<< "$MATCHES")"

  publish:
    name: Publish ${{ matrix.package.name }}
    needs: detect
    # Official OIDC path: the reusable workflow validates the package, builds an
    # archive, then publishes it with `dart pub publish --from-archive` inside a
    # job holding id-token: write. Publishing directly instead made the CLI fall
    # back to interactive browser auth, so keep the documented mechanism.
    permissions:
      id-token: write # Required for OIDC token minting
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: ${{ matrix.package.dir }}
