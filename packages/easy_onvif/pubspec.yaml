name: easy_onvif
version: 3.1.5
homepage: https://github.com/faithoflifedev/easy_onvif_workspace/blob/main/packages/easy_onvif
description: This package can work with a variety of ONVIF compatible devices allowing for IP Cameras and NVRs (network video recorders) to be integrated into Dart and Flutter applications.
repository: https://github.com/faithoflifedev/easy_onvif_workspace
issue_tracker: https://github.com/faithoflifedev/easy_onvif_workspace/issues

funding:
  - https://buymeacoffee.com/cdavis

topics:
  - onvif
  - camera
  - ptz
  - streaming
  - iot

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  convert: ^3.1.2
  crypto: ^3.0.7
  dio: ^5.11.0
  ffi: ^2.2.0
  html_unescape: ^2.0.0
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.3
  json_annotation: ^4.11.0
  loggy: ^2.0.3
  path: ^1.9.1
  uuid: ^4.6.0
  xml: ^7.0.1
  xml2json: ^6.2.8
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.15.3
  json_serializable: ^6.13.1
  lints: ^6.1.0
  test: ^1.31.2
