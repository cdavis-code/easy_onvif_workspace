version: 0.1.0
publish_to: none
homepage: https://github.com/faithoflifedev/easy_onvif_workspace/tree/main/packages/easy_onvif_js
repository: https://github.com/faithoflifedev/easy_onvif_workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  dio: ^5.9.2
  easy_onvif: ^3.1.3+1
  # easy_onvif:
  #   path: ../easy_onvif
  loggy: ^2.0.3
  uuid: ^4.5.3
  web: ^1.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
