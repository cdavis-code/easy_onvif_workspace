name: easy_onvif_mcp_example
version: 0.0.1
description: Runnable examples for the easy_onvif_mcp MCP server.
publish_to: none

environment:
  sdk: ^3.10.3

dependencies:
  dart_mcp: ^0.5.1
  easy_onvif_mcp:
    path: ../

# The example resolves outside the workspace, so easy_onvif_mcp's
# `easy_onvif: ^3.3.0` would be looked up on pub.dev before 3.3.0 is released.
# Pin the in-repo copy, exactly as packages/easy_onvif_cli/example does.
dependency_overrides:
  easy_onvif:
    path: ../../easy_onvif
