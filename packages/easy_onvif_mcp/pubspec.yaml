name: easy_onvif_mcp
version: 0.1.0
homepage: https://github.com/cdavis-code/easy_onvif_workspace/tree/main/packages/easy_onvif_mcp
description: MCP server exposing ONVIF IP camera and NVR control (device management, media, PTZ, imaging, recordings) over stdio.
repository: https://github.com/cdavis-code/easy_onvif_workspace/tree/main/packages/easy_onvif_mcp
issue_tracker: https://github.com/cdavis-code/easy_onvif_workspace/issues

