name: easy_onvif_workspace

environment:
  sdk: ^3.10.3

workspace:
  - packages/easy_onvif
  - packages/easy_onvif_cli
  - packages/easy_onvif_js
  - packages/easy_onvif_mcp

dev_dependencies:
  melos: ^8.2.2

melos:
  packages:
  - packages/**
  - '!packages/**/example'
  # The Flutter simulator resolves against the Flutter SDK, whose flutter_test
  # pins test_api 0.7.12 — incompatible with this workspace's `test` for
  # easy_onvif. It lives under packages/ for layout only; resolve and test it
  # with `flutter pub get` / `flutter test` inside the directory.
  - '!packages/easy_onvif_server'

  command:
    version:
      branch: main
      message: "chore(release): publish %s"

  bootstrap:
    runPubGetInParallel: false
    usePubspecOverrides: true

  scripts:
    lint:all:
      run: melos run analyze && melos run format
      description: Run all static analysis checks.

    # publish:all:
    #   run: melos run publish:dart && melos run publish:flutter
    #   description: Run publish for all packages.

    dep:
      exec: dart pub get

    build:
      exec: dart run build_runner build

    build:npm:
      description: Build the `easy-onvif` npm package and the `easy-onvif-mcp` npm package.
      run: melos run build:npm:library && melos run build:npm:mcp

    build:npm:library:
      description: Build both runtimes of the `easy-onvif` npm package into packages/easy_onvif_js/dist.
      run: bash packages/easy_onvif_js/tool/build_node.sh && bash packages/easy_onvif_js/tool/build_web.sh

    test:npm:library:
      description: Exercise the `easy-onvif` node loader over real interop and verify the browser artifacts and export map.
      run: node packages/easy_onvif_js/tool/smoke_test_node.mjs && node packages/easy_onvif_js/test/web/artifacts.mjs

    pack:npm:library:
      description: Show the exact packed file list for the `easy-onvif` npm package.
      run: bash -c 'cd packages/easy_onvif_js && npm pack --dry-run'

    build:npm:mcp:
      description: Build the `easy-onvif-mcp` npm artifact (the ONVIF MCP server) via dart2js.
      run: bash packages/easy_onvif_mcp/tool/build_mcp_node.sh

    test:npm:mcp:
      description: Smoke-test the compiled `easy-onvif-mcp` bundle over a real MCP handshake.
      run: node --test packages/easy_onvif_mcp/test/npm/smoke.mjs

    pack:npm:mcp:
      description: Verify the `easy-onvif-mcp` bin wiring and show its packed file list.
      run: bash -c 'cd packages/easy_onvif_mcp && node tool/check_bin.mjs && npm pack --dry-run'

    release:npm:
      description: Bump, build, commit and tag the `easy-onvif` npm package. Does not publish - pushing the tag triggers CI publish.
      run: bash packages/easy_onvif_js/tool/publish_npm.sh

    release:npm:mcp:
      description: Bump, build, commit and tag the `easy-onvif-mcp` npm package. Does not publish - pushing the tag triggers CI publish.
      run: bash packages/easy_onvif_mcp/tool/publish_npm.sh

    publish:npm:
      description: Publish both npm packages to the registry immediately, from the current working tree.
      run: bash tool/publish_npm_now.sh

    build:delete:
      run: false
      steps:
        - melos exec --scope="activation_config" -- "dart run build_runner build --delete-conflicting-outputs"
        - melos exec --ignore="activation_config" -- "dart run build_runner build --delete-conflicting-outputs"

    # prep:flutter:
    #   run: melos run build && melos run meta && melos run markdown && melos run analyze && melos run format
    #   description: Run prep steps Flutter.

    ## TODO: Add commit steps for Dart and Flutter packages.

    commit:lib:
      run: melos exec --ignore="easy_onvif_cli" git add .; git commit -m "$(cat packages/easy_onvif/tool/publish_tools.yaml | yq -r '.commit')"; git push origin main
      description: Commit changes for lib package.

    commit:cli:
      run: melos exec --ignore="easy_onvif" git add .; git commit -m "$(cat packages/easy_onvif_cli/tool/publish_tools.yaml | yq -r '.commit')"; git push origin main
      description: Commit changes for Flutter package.

    # publish:real:lib:
    #   run: melos exec --ignore="onvif_cli" dart pub publish --force
    #   description: Real publish for easy_onvif library Package.

    # publish:real:cli:
    #   run: melos exec --ignore="easy_onvif" dart pub publish --force
    #   description: Real publish for onvif cli Package.

    # publish:cli:
    #   run: melos run meta && melos run analyze && melos run format && melos run markdown && melos run dryrun:flutter
    #   description: Run `dart publish` for all packages.melos

    dryrun:lib:
      run: melos exec --scope="easy_onvif" dart pub publish --dry-run
      description: Run `dart pub publish --dry-run` for lib package.

    dryrun:cli:
      run: melos exec --scope="easy_onvif_cli" dart pub publish --dry-run
      description: Run `dart pub publish --dry-run` for cli package.

    dryrun:mcp:
      run: melos exec --scope="easy_onvif_mcp" dart pub publish --dry-run
      description: Run `dart pub publish --dry-run` for the MCP server package.

    # build:
    #   run: melos exec --ignore="packages/easy_onvif_cli" dart run build_runner build --delete-conflicting-outputs
    #   select-package:
    #     depends-on: build_runner

    analyze:
      exec: dart analyze .
      description: Run `dart analyze` in all packages.

    format:
      run: melos exec dart format .
      description: Run `dart format` for all packages.

    format-check:
      run: melos exec dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.

    dartdoc:
      run: melos exec dart doc .
      description: Run dartdoc checks for all packages.

    markdown:
      run: melos exec grind 'pt-markdown'
      description: Run markdown generator for all packages.

    meta:
      description: Run metadata generator for all packages.
      run: melos exec grind 'pt-meta'

    pana:
      run: melos exec pana --no-dartdoc .
      description: Run pana checks for all packages.

      # clean:deep:
      #   run: git clean -x -d -f -q
      #   description: Clean things very deeply, can be used to establish "pristine checkout" status.
